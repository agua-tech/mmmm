<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de IMC</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
          
</head>
<body class="min-vh-100" style="background-color: #a3b1d194;">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="text-center mb-4">Calculo de IMC</h1>

             <input class="form-control mb-3" type="number"    name="peso" id="peso"  placeholder="Peso en (kg)"/>
              <input class="form-control mb-3" type="number" name="altura" id="altura"  placeholder="Altura en (M)" step="any"/>
              <button type="button" class="btn btn-primary w-100" onclick="calcular_imc()">Calcular IMC</button>
              <p id="imc" class="mt-3"></p>
        </div>
    </div>
      <div class="row justify-content-center mt-5">
        <div class="col-md-10">
            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Peso(kg)</th>
                        <th>Altura(M)</th>
                        <th>IMC</th>
                        <th>Clasificación</th>
                    </tr>
                </thead>
                <tbody id="tablaIMC"></tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="imc.js"></script>
</body>
</html>
